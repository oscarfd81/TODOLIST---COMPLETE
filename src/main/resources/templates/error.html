<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>

<div class="auth-page">
  <!-- TARJETA DE ERROR CENTRALIZADA -->
  <div class="auth-card" style="text-align:center">
    
    <!-- ICONO DINÁMICO SEGÚN EL ESTADO -->
    <div style="font-size:64px;margin-bottom:16px">
      <span th:if="${status == 403}">🔒</span>
      <span th:if="${status == 404}">🔍</span>
      <span th:if="${status != 403 and status != 404}">⚠️</span>
    </div>

    <!-- TÍTULO: CÓDIGO DE ERROR -->
    <h1 style="font-size:48px;font-weight:800;color:var(--text-primary);margin-bottom:8px"
        th:text="${status}">Error</h1>
    
    <!-- SUBTÍTULO: DESCRIPCIÓN DEL ERROR -->
    <h2 style="font-size:18px;margin-bottom:12px;color:var(--text-secondary)"
        th:text="${error}">Error</h2>
    
    <!-- MENSAJE DETALLADO -->
    <p class="text-muted" style="margin-bottom:24px"
       th:text="${message != null ? message : 'Ha ocurrido un error inesperado.'}">
      Ha ocurrido un error.
    </p>

    <!-- ENLACE DE NAVEGACIÓN A PÁGINA SEGURA -->
    <a href="/tasks/board" class="btn btn-primary">← Volver al inicio</a>
  </div>
</div>

<!-- SCRIPT DE INTERACCIÓN -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
