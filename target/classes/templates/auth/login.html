<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>

<!-- CONTENEDOR DE LA PÁGINA DE AUTENTICACIÓN -->
<div class="auth-page">
  <div class="auth-card">
    
    <!-- ENCABEZADO CON LOGOTIPO -->
    <div class="auth-logo">
      <h1>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:middle;margin-right:6px">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        TaskFlow
      </h1>
      <p>Organiza tus tareas de forma visual y eficiente</p>
    </div>

    <!-- BLOQUES DE ALERTAS SEGÚN EL ESTADO DE LA SESIÓN -->
    <div th:if="${param.error}" class="alert alert-danger">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
      Sesión cerrada correctamente.
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->
    <form th:action="@{/auth/login}" method="post">
      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <input id="username" name="username" type="text" class="form-control"
               placeholder="Tu nombre de usuario" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password"/>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="margin-top:8px;padding:10px">
        Iniciar sesión
      </button>
    </form>

    <!-- ENLACE PARA REGISTRO DE NUEVA CUENTA -->
    <div class="auth-divider">¿No tienes cuenta?</div>
    <a th:href="@{/auth/register}" class="btn btn-ghost w-100" style="justify-content:center">
      Crear cuenta nueva
    </a>

  </div>
</div>

<!-- SCRIPT DE INICIALIZACIÓN -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
