<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>

<!-- CONTENEDOR DE LA PÁGINA DE AUTENTICACIÓN -->
<div class="auth-page">
  <div class="auth-card">
    
    <!-- ENCABEZADO Y TÍTULO -->
    <div class="auth-logo">
      <h1>Crear cuenta</h1>
      <p>Únete a TaskFlow y empieza a organizar tu trabajo</p>
    </div>

    <!-- FORMULARIO DE REGISTRO DE USUARIO -->
    <form th:action="@{/auth/register}" th:object="${form}" method="post" novalidate>
      
      <!-- CAMPO NOMBRE DE USUARIO -->
      <div class="form-group">
        <label class="form-label" for="username">Nombre de usuario</label>
        <input id="username" type="text" class="form-control"
               th:field="*{username}" placeholder="juanperez" required/>
        <!-- MOSTRAR ERRORES DE VALIDACIÓN -->
        <div class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
      </div>
      
      <!-- CAMPO EMAIL -->
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input id="email" type="email" class="form-control"
               th:field="*{email}" placeholder="juanperez@email.com" required/>
        <!-- MOSTRAR ERRORES DE VALIDACIÓN -->
        <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      
      <!-- CAMPO CONTRASEÑA -->
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" type="password" class="form-control"
               th:field="*{password}" placeholder="Mínimo 4 caracteres" required/>
        <!-- MOSTRAR ERRORES DE VALIDACIÓN -->
        <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <!-- BOTÓN DE ENVÍO -->
      <button type="submit" class="btn btn-primary w-100" style="padding:10px;margin-top:8px">
        Crear cuenta
      </button>
    </form>

    <!-- ENLACE A INICIO DE SESIÓN -->
    <div class="auth-divider">¿Ya tienes cuenta?</div>
    <a th:href="@{/auth/login}" class="btn btn-ghost w-100" style="justify-content:center">
      Iniciar sesión
    </a>
    
  </div>
</div>

<!-- SCRIPT DE INTERACCIÓN -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
