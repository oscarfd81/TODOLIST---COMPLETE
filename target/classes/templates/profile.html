<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mi Perfil')}"></head>
<body>

<div class="app-layout">
  <nav th:replace="~{fragments/layout :: sidebar}"></nav>

  <main class="main-content">
    
    <!-- ENCABEZADO DE PÁGINA -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Mi Perfil</h1>
        <p class="page-subtitle">Gestiona tu cuenta y contraseña</p>
      </div>
    </div>

    <div class="page-body" style="max-width:640px">
      <!-- NOTIFICACIONES DEL SISTEMA -->
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <!-- SECCIÓN: INFORMACIÓN DE CUENTA -->
      <div class="card mb-16">
        <div class="card-header">Información de cuenta</div>
        <div class="card-body">
          
          <!-- CABECERA DE PERFIL -->
          <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px">
            <div style="width:64px;height:64px;border-radius:50%;background:var(--bg-nav);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">
              👤
            </div>
            <div>
              <div style="font-size:20px;font-weight:700" th:text="${user.username}">username</div>
              <div class="text-secondary" th:text="${user.email}">email</div>
              <div style="margin-top:6px">
                <span class="role-badge admin"  th:if="${user.admin}">Admin</span>
                <span class="role-badge gestor" th:if="${user.gestor and !user.admin}">Gestor</span>
                <span class="role-badge user"   th:if="${!user.admin and !user.gestor}">User</span>
              </div>
            </div>
          </div>

          <!-- DETALLES ADICIONALES -->
          <div class="responsive-grid-2">
            <div>
              <div class="detail-meta-label">Usuario</div>
              <div class="detail-meta-value" th:text="${user.username}">—</div>
            </div>
            <div>
              <div class="detail-meta-label">Email</div>
              <div class="detail-meta-value" th:text="${user.email}">—</div>
            </div>
            <div>
              <div class="detail-meta-label">Rol</div>
              <div class="detail-meta-value" th:text="${user.admin} ? 'ADMIN' : (${user.gestor} ? 'GESTOR' : 'USER')">—</div>
            </div>
            <div>
              <div class="detail-meta-label">ID</div>
              <div class="detail-meta-value" th:text="${user.id}">—</div>
            </div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN: CAMBIAR CONTRASEÑA -->
      <div class="card">
        <div class="card-header">Cambiar contraseña</div>
        <div class="card-body">
          <form th:action="@{/profile/password}" method="post">
            
            <div class="form-group">
              <label class="form-label" for="currentPassword">Contraseña actual</label>
              <input id="currentPassword" name="currentPassword" type="password"
                     class="form-control" placeholder="Tu contraseña actual" required/>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="newPassword">Nueva contraseña</label>
              <input id="newPassword" name="newPassword" type="password"
                     class="form-control" placeholder="Mínimo 4 caracteres" required/>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirmar nueva contraseña</label>
              <input id="confirmPassword" name="confirmPassword" type="password"
                     class="form-control" placeholder="Repite la nueva contraseña" required/>
            </div>
            
            <button type="submit" class="btn btn-primary">
              🔒 Actualizar contraseña
            </button>
          </form>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- SCRIPT DE INTERACCIÓN -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
