<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${task.title})}"></head>
<body>

<div class="app-layout">
  <nav th:replace="~{fragments/layout :: sidebar}"></nav>

  <main class="main-content">
    
    <!-- ENCABEZADO: TÍTULO Y ACCIONES -->
    <div class="page-header">
      <div>
        <h1 class="page-title">
          <span th:if="${task.important}" style="color:#ff8b00;margin-right:6px">
            <i class="fa-solid fa-star text-warning"></i>
          </span>
          <span th:text="${task.title}">Título</span>
        </h1>
        <p class="page-subtitle">
          Creada el <span th:text="${#temporals.format(task.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
        </p>
      </div>
      <div class="d-flex gap-8">
        <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-primary btn-sm">
          <i class="fa-solid fa-pen-to-square"></i> Editar
        </a>
        <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post"
              data-confirm="¿Estás seguro de que quieres eliminar esta tarea?">
          <button type="submit" class="btn btn-danger btn-sm">
            <i class="fa-solid fa-trash-can"></i> Eliminar
          </button>
        </form>
        <a th:href="@{/tasks}" class="btn btn-ghost btn-sm">
          <i class="fa-solid fa-arrow-left"></i> Volver
        </a>
      </div>
    </div>

    <div class="page-body">
      <!-- ALERTAS DEL SISTEMA -->
      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="detail-grid">
        
        <!-- COLUMNA PRINCIPAL: DESCRIPCIÓN Y ETIQUETAS -->
        <div>
          <div class="card mb-16">
            <div class="card-header">Descripción</div>
            <div class="card-body">
              <p th:if="${task.description != null and !task.description.isEmpty()}"
                 th:text="${task.description}"
                 style="white-space:pre-line;line-height:1.7;color:var(--text-primary)"></p>
              <p th:if="${task.description == null or task.description.isEmpty()}"
                 class="text-muted">Sin descripción</p>
            </div>
          </div>

          <!-- ETIQUETAS ASOCIADAS -->
          <div class="card" th:if="${task.tags != null and !#lists.isEmpty(task.tags)}">
            <div class="card-header">Etiquetas</div>
            <div class="card-body" style="display:flex;flex-wrap:wrap;gap:8px">
              <span th:each="tag : ${task.tags}" class="badge badge-tag" 
                    style="font-size:13px;padding:5px 12px" th:text="${tag.name}">tag</span>
            </div>
          </div>
        </div>

        <!-- COLUMNA LATERAL: METADATOS Y CONTROL -->
        <div>
          <div class="card">
            <div class="card-header">Detalles</div>
            <div class="card-body">

              <div class="detail-meta-item">
                <span class="detail-meta-label">Estado</span>
                <span class="badge"
                      th:classappend="'badge-status-' + ${#strings.toLowerCase(task.status)}"
                      th:text="${task.status}" style="font-size:13px;padding:4px 12px">Estado</span>
              </div>

              <div class="detail-meta-item">
                <span class="detail-meta-label">Prioridad</span>
                <span class="badge"
                      th:classappend="'badge-prio-' + ${#strings.toLowerCase(task.priority)}"
                      th:text="${task.priority}" style="font-size:13px;padding:4px 12px">Prioridad</span>
              </div>

              <div class="detail-meta-item">
                <span class="detail-meta-label">Categoría</span>
                <span class="detail-meta-value"
                      th:text="${task.category != null ? task.category.name : 'Sin categoría'}">—</span>
              </div>

              <div class="detail-meta-item">
                <span class="detail-meta-label">Fecha límite</span>
                <span th:if="${task.deadline != null}" class="deadline"
                      th:classappend="${task.deadline.isBefore(T(java.time.LocalDateTime).now())} ? 'overdue' :
                                      (${task.deadline.isBefore(T(java.time.LocalDateTime).now().plusDays(2))} ? 'urgent' : 'ok')"
                      th:text="${#temporals.format(task.deadline, 'dd/MM/yyyy HH:mm')}">—</span>
                <span th:if="${task.deadline == null}" class="text-muted">Sin fecha</span>
              </div>

              <div class="detail-meta-item">
                <span class="detail-meta-label">Autor</span>
                <span class="detail-meta-value"
                      th:text="${task.author != null ? task.author.username : '—'}">—</span>
              </div>

              <div class="detail-meta-item">
                <span class="detail-meta-label">Importante</span>
                <span class="detail-meta-value">
                  <span th:if="${task.important}" style="color:#ff8b00;font-weight:600"><i class="fa-solid fa-star text-warning"></i> Sí</span>
                  <span th:unless="${task.important}" class="text-muted">No</span>
                </span>
              </div>

              <div class="detail-meta-item" th:if="${task.updatedAt != null}">
                <span class="detail-meta-label">Última actualización</span>
                <span class="detail-meta-value"
                      th:text="${#temporals.format(task.updatedAt, 'dd/MM/yyyy HH:mm')}">—</span>
              </div>

              <!-- SECCIÓN: CAMBIO DE ESTADO RÁPIDO -->
              <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
                <span class="detail-meta-label" style="display:block;margin-bottom:8px">Cambiar estado</span>
                <select class="form-control status-select" th:data-task-id="${task.id}">
                  <option value="PENDIENTE"   th:selected="${task.status.name() == 'PENDIENTE'}">Pendiente</option>
                  <option value="EN_PROCESO"  th:selected="${task.status.name() == 'EN_PROCESO'}">En proceso</option>
                  <option value="HECHO"       th:selected="${task.status.name() == 'HECHO'}">Hecho</option>
                  <option value="NO_HECHO"    th:selected="${task.status.name() == 'NO_HECHO'}">No hecho</option>
                </select>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- SCRIPT DE FUNCIONALIDADES -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
